<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remote">
  <title>Kodi Remote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='18' y='4' width='28' height='56' rx='14' fill='%231c1c1e'/%3E%3Ccircle cx='32' cy='20' r='9' fill='%23636366'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/htmx.min.js" defer></script>
  <script src="assets/idiomorph-ext.min.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body hx-ext="morph">
  <img id="ambient" class="ambient" alt="">
  <svg class="sprite" aria-hidden="true">
    <!-- Drawn on a 24px grid in the spirit of SF Symbols: one 2px stroke weight, round caps
         and joins, softened corners, and solid glyphs where Apple uses .fill variants. -->
    <defs>
      <path id="g-speaker" d="M10.3 5.1 6.8 8.2H4.8A1.8 1.8 0 0 0 3 10v4a1.8 1.8 0 0 0 1.8 1.8h2l3.5 3.1c.65.58 1.7.12 1.7-.76V5.86c0-.88-1.05-1.34-1.7-.76z"/>
    </defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 6.1a1.6 1.6 0 0 1 2.43-1.37l9.86 5.9a1.6 1.6 0 0 1 0 2.74l-9.86 5.9A1.6 1.6 0 0 1 7 17.9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><g fill="currentColor"><rect x="6" y="4.5" width="4.4" height="15" rx="1.6"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.6"/></g></symbol>
    <symbol id="i-playpause" viewBox="0 0 24 24"><g fill="currentColor"><path d="M2 7.4a1.1 1.1 0 0 1 1.7-.92l6.9 4.6a1.1 1.1 0 0 1 0 1.84l-6.9 4.6A1.1 1.1 0 0 1 2 16.6z"/><rect x="14" y="6.5" width="3" height="11" rx="1.2"/><rect x="19" y="6.5" width="3" height="11" rx="1.2"/></g></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" d="M14.8 4.8 7.6 12l7.2 7.2"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2.8"/><path d="M8.5 20.5h7"/></g></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3.2v7.6"/><path d="M7.1 6.2a8 8 0 1 0 9.8 0"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M5.5 12h13"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><use href="#g-speaker" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m15.6 9.6 4.8 4.8m0-4.8-4.8 4.8"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><use href="#g-speaker" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.4 9.3a3.9 3.9 0 0 1 0 5.4M18.2 6.6a7.7 7.7 0 0 1 0 10.8"/></symbol>
    <symbol id="i-back10" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 4.6a7.6 7.6 0 1 1-7.6 7.6"/><path fill="currentColor" d="M12.9 2.3v4.6a.5.5 0 0 1-.78.42L8.9 5.06a.5.5 0 0 1 0-.84l3.22-2.3a.5.5 0 0 1 .78.42z"/><text x="12.2" y="15.5" fill="currentColor" font-size="7" font-weight="700" letter-spacing="-.2" text-anchor="middle" font-family="ui-rounded, -apple-system, system-ui, sans-serif">10</text></symbol>
    <symbol id="i-fwd30" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 4.6a7.6 7.6 0 1 0 7.6 7.6"/><path fill="currentColor" d="M11.1 2.3v4.6a.5.5 0 0 0 .78.42l3.22-2.26a.5.5 0 0 0 0-.84l-3.22-2.3a.5.5 0 0 0-.78.42z"/><text x="11.8" y="15.5" fill="currentColor" font-size="7" font-weight="700" letter-spacing="-.2" text-anchor="middle" font-family="ui-rounded, -apple-system, system-ui, sans-serif">30</text></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect fill="currentColor" x="5.5" y="5.5" width="13" height="13" rx="3"/></symbol>
    <symbol id="i-waveform" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3.5 10.8v2.4M7.25 8v8M11 4.5v15M14.75 7.5v9M18.5 10v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m5.6 12.6 4.1 4.1 8.7-9.3"/></symbol>
    <symbol id="i-remote" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M10.6 1.8h2.8a3.6 3.6 0 0 1 3.6 3.6v13.2a3.6 3.6 0 0 1-3.6 3.6h-2.8A3.6 3.6 0 0 1 7 18.6V5.4a3.6 3.6 0 0 1 3.6-3.6zM12 4.4a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zm0 8.2a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3zm0 3.6a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M6 3.5h12A3 3 0 0 1 21 6.5v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-11a3 3 0 0 1 3-3zm-.9 3v1.9H7V6.5zm0 4.55v1.9H7v-1.9zm0 4.55v1.9H7v-1.9zM17 6.5v1.9h1.9V6.5zm0 4.55v1.9h1.9v-1.9zm0 4.55v1.9h1.9v-1.9zM9.3 6.5a.8.8 0 0 0-.8.8v9.4a.8.8 0 0 0 .8.8h5.4a.8.8 0 0 0 .8-.8V7.3a.8.8 0 0 0-.8-.8z"/></symbol>
  </svg>

  <div class="app" data-view="remote">
    <aside class="device">
      {% include "status.html" %}

      <div class="remote" hx-sync="this:queue all" aria-label="Remote">
        <div class="pad" id="pad" role="group" aria-label="Touch surface. Swipe or press an edge to move, press the center to select.">
          <span class="pad-center"></span>
          <i class="pad-dot" data-dir="up"></i>
          <i class="pad-dot" data-dir="right"></i>
          <i class="pad-dot" data-dir="down"></i>
          <i class="pad-dot" data-dir="left"></i>
          <span class="pad-glow"></span>
        </div>

        <div class="keys">
          <button class="key key-back" hx-post="input/back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
          <button class="key key-home" hx-post="input/home" aria-label="Home"><svg><use href="#i-tv"/></svg></button>
          <button class="key key-play" hx-post="player/play-pause" aria-label="Play or pause"><svg><use href="#i-playpause"/></svg></button>
          <div class="volume" role="group" aria-label="Volume">
            <button hx-post="volume/up" aria-label="Volume up"><svg><use href="#i-plus"/></svg></button>
            <button hx-post="volume/down" aria-label="Volume down"><svg><use href="#i-minus"/></svg></button>
          </div>
          <button class="key key-mute" hx-post="mute" aria-label="Mute"><svg><use href="#i-mute"/></svg></button>
        </div>
      </div>
    </aside>

    <main class="library">
      <header class="library-head">
        <h1>Library</h1>
        {#- The selected tab also reloads when Kodi is switched on, so the grid stops saying "Kodi is off". -#}
        <div class="segmented" role="tablist" aria-label="Library section">
          <button role="tab" aria-selected="true" data-segment hx-get="movies" hx-target="#media"
                  hx-trigger="click, launched[this.getAttribute('aria-selected') === 'true'] from:body">Movies</button>
          <button role="tab" aria-selected="false" data-segment hx-get="shows" hx-target="#media"
                  hx-trigger="click, launched[this.getAttribute('aria-selected') === 'true'] from:body">TV Shows</button>
        </div>
      </header>
      <div id="media" hx-get="movies" hx-trigger="load">
        <ul class="grid" aria-hidden="true">
          <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
          <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
        </ul>
      </div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Views">
    <button data-view="remote" aria-pressed="true"><svg><use href="#i-remote"/></svg><span>Remote</span></button>
    <button data-view="library" aria-pressed="false"><svg><use href="#i-film"/></svg><span>Library</span></button>
  </nav>

  <dialog id="audio-sheet" class="sheet" aria-labelledby="audio-title">
    <header class="sheet-head">
      <h2 id="audio-title">Audio</h2>
      <button class="sheet-done" data-close>Done</button>
    </header>
    <div id="audio-body" class="sheet-body"></div>
  </dialog>

  <dialog id="power-sheet" class="sheet sheet-alert" aria-labelledby="power-title">
    <div class="alert-icon"><svg><use href="#i-power"/></svg></div>
    <h2 id="power-title">Turn off Kodi?</h2>
    <p>Playback stops and Kodi closes on the TV.</p>
    <button class="alert-danger" hx-post="kodi/quit" hx-disabled-elt="this" data-close-after>
      <span class="when-idle">Turn Off</span><span class="when-busy">Turning off…</span>
    </button>
    <button class="alert-cancel" data-close>Cancel</button>
  </dialog>

  <div class="hud" id="hud" aria-hidden="true">
    <svg class="hud-icon"><use href="#i-speaker"/></svg>
    <span class="hud-bar"><span></span></span>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
