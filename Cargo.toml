[package]
name = "kodi-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
