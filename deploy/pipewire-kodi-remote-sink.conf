# A virtual sound output that Kodi can play into; go2rtc records its monitor and streams
# it to the web remote over WebRTC ("Listen on this device").
# Install: ~/.config/pipewire/pipewire.conf.d/60-kodi-remote-sink.conf
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "kodi_remote"
            node.description = "Kodi Remote stream"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.rate       = 48000
        }
    }
]
